name: CI

# Policy:
#   pull_request        -> lint, test, and build (a new commit cancels the previous run)
#   push to main        -> the same; runs are never cancelled by a later push, so a build that
#                          waited in the macOS runner queue still gets to finish
#   tag vX.Y.Z          -> see release.yml, which publishes the release
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# One runner per ref: a push no longer kills a queued/running job (that looked like a hang).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: CLI + GUI on macOS
    # Apple silicon: the engine and the frozen CLI are arm64 only.
    runs-on: macos-15
    # A stuck job fails instead of hanging for the 6-hour default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Confirm the runner is arm64
        run: test "$(uname -m)" = arm64

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Test the CLI
        run: uv run pytest -q

      - name: Smoke test the CLI
        run: |
          uv run nx2mac version
          uv run nx2mac version --json
          uv run nx2mac --help >/dev/null
          uv run nx2mac doctor --json | head -c 200; echo

      - name: Build the GUI
        run: swift build --package-path gui

      - name: Test the GUI
        run: swift test --package-path gui

      - name: Assemble the app bundle (freezes the CLI inside it)
        run: ./gui/build.sh release dist

      - name: Smoke test the bundled CLI
        run: |
          CLI=dist/nx2mac.app/Contents/Resources/cli/nx2mac
          test -x "$CLI"
          "$CLI" version
          codesign -v dist/nx2mac.app

      - name: Package the release build
        run: |
          VERSION="$(uv run python -c 'import nx2mac; print(nx2mac.VERSION)')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p out
          ditto -c -k --sequesterRsrc --keepParent \
            gui/.build/cli-dist/nx2mac "out/nx2mac-cli-$VERSION-macos-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            dist/nx2mac.app "out/nx2mac-app-$VERSION-macos-arm64.zip"
          cd out && shasum -a 256 ./*.zip > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: nx2mac-${{ env.VERSION }}-macos-arm64-${{ github.event_name }}
          path: out/*
          if-no-files-found: error
