name: Release

# Tag-driven only: pushing `vX.Y.Z` publishes that version.
#
#   git tag -a v0.0.1 -m "nx2mac v0.0.1" && git push origin v0.0.1
#
# The tag decides the version; the build fails when the tag, `VERSION` in
# src/nx2mac/__init__.py and gui/Info.plist disagree, so a tag can never publish
# something else than it says.
#
# Assets: an installable disk image (nx2mac-<version>-macos-arm64.dmg, the app next to an
# /Applications symlink), the GUI app with the frozen CLI bundled inside as a zip, the standalone
# CLI, and SHA256SUMS — all named after the tag.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"  # pre-releases such as v0.0.2-beta.1

permissions:
  contents: write

jobs:
  release:
    name: Release ${{ github.ref_name }}
    # Apple silicon: the engine's tooling and the frozen CLI must be arm64.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Confirm the runner is arm64
        run: test "$(uname -m)" = arm64

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: The tag is the version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "releasing $TAG (version $VERSION)"

      - name: Check the tag matches the package and the app
        run: |
          PACKAGE="$(uv run python -c 'import nx2mac; print(nx2mac.VERSION)')"
          PLIST="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' gui/Info.plist)"
          if [ "$TAG" != "v$PACKAGE" ]; then
            echo "::error::tag $TAG does not match VERSION $PACKAGE in src/nx2mac/__init__.py"
            exit 1
          fi
          if [ "$TAG" != "v$PLIST" ]; then
            echo "::error::tag $TAG does not match CFBundleShortVersionString $PLIST in gui/Info.plist"
            exit 1
          fi
          echo "tag, package version and app version all say $TAG"

      - name: Lint and test before shipping
        run: |
          uv run ruff check src/ tests/
          uv run pytest -q
          swift test --package-path gui

      - name: Build the app (freezes the CLI into Contents/Resources/cli)
        run: ./gui/build.sh release dist

      - name: Package
        run: |
          mkdir -p out
          CLI="gui/.build/cli-dist/nx2mac"
          APP="dist/nx2mac.app"
          test -x "$CLI/nx2mac"
          "$CLI/nx2mac" version

          # ditto keeps the bundle structure, permissions and symlinks intact.
          ditto -c -k --sequesterRsrc --keepParent "$CLI" "out/nx2mac-cli-$VERSION-macos-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "out/nx2mac-app-$VERSION-macos-arm64.zip"

          # Prove the app carries a working CLI before publishing it.
          "$APP/Contents/Resources/cli/nx2mac" version

          # The download most people want: mount it and drag the app to Applications.
          ./packaging/make_dmg.sh "$APP" "$VERSION" out

          cd out && shasum -a 256 ./*.zip ./*.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: nx2mac-${{ env.VERSION }}-macos-arm64
          path: out/*
          if-no-files-found: error

      - name: Publish the release for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "nx2mac $TAG" \
            --generate-notes \
            "out/nx2mac-$VERSION-macos-arm64.dmg" \
            "out/nx2mac-app-$VERSION-macos-arm64.zip" \
            "out/nx2mac-cli-$VERSION-macos-arm64.zip" \
            out/SHA256SUMS.txt
