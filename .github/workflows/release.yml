name: Release

# Cutting a release: push a tag (the tag must match VERSION) or run this by hand.
#
#   git tag -a v0.0.1 -m "nx2mac v0.0.1" && git push origin v0.0.1
#
# Assets: the standalone CLI (PyInstaller onedir), the GUI app with that CLI
# bundled inside, and SHA256SUMS.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (must match VERSION in src/nx2mac/__init__.py)"
        default: v0.0.1
        required: true
      create_release:
        description: "Create a GitHub Release (otherwise the builds are only uploaded as workflow artifacts)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build CLI + GUI
    # Apple silicon: the engine's tooling and the frozen CLI must be arm64.
    runs-on: macos-15
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Confirm the runner is arm64
        run: test "$(uname -m)" = arm64

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lint and test before shipping
        run: |
          uv run ruff check src/ tests/
          uv run pytest -q
          swift test --package-path gui

      - name: Check that the tag matches the package version
        run: |
          VERSION="$(uv run python -c 'import nx2mac; print(nx2mac.VERSION)')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match VERSION $VERSION (bump src/nx2mac/__init__.py and gui/Info.plist)"
            exit 1
          fi
          PLIST="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' gui/Info.plist)"
          if [ "$PLIST" != "$VERSION" ]; then
            echo "::error::gui/Info.plist has $PLIST but the package is $VERSION"
            exit 1
          fi

      - name: Build the app (freezes the CLI into Contents/Resources/cli)
        run: ./gui/build.sh release dist

      - name: Package
        run: |
          mkdir -p out
          CLI="gui/.build/cli-dist/nx2mac"
          APP="dist/nx2mac.app"
          test -x "$CLI/nx2mac"
          "$CLI/nx2mac" version

          # ditto keeps the bundle structure and symlinks intact.
          ditto -c -k --sequesterRsrc --keepParent "$CLI" "out/nx2mac-cli-$VERSION-macos-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "out/nx2mac-app-$VERSION-macos-arm64.zip"

          # Prove the app carries a working CLI before publishing it.
          "$APP/Contents/Resources/cli/nx2mac" version

          cd out && shasum -a 256 *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: nx2mac-${{ env.VERSION }}-macos-arm64
          path: out/*
          if-no-files-found: error

      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/') || inputs.create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "nx2mac $TAG" \
            --generate-notes \
            out/nx2mac-cli-"$VERSION"-macos-arm64.zip \
            out/nx2mac-app-"$VERSION"-macos-arm64.zip \
            out/SHA256SUMS.txt
