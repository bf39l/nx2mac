[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nx2mac"
version = "0.1.0"
description = "Build Nintendo Switch games into native macOS apps"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
nx2mac = "nx2mac.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.12",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# typer builds its interface from Option/Argument calls inside argument defaults.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.hatch.build.targets.wheel]
packages = ["src/nx2mac"]

# ship the engine patch series with installed packages
[tool.hatch.build.targets.wheel.force-include]
"patches" = "nx2mac/patches"
