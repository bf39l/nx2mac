name: CI

# Policy:
#   pull_request  -> lint, test, and build (a newer commit cancels the previous run)
#   push to main  -> the same, and the release build is uploaded as an artifact; runs are never
#                    cancelled by a later push, so a job that waited in the macOS queue finishes
#   tag vX.Y.Z    -> see release.yml, which publishes the release
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The CLI is pure Python (every check runs through the fake Env in tests): Linux gives fast
  # feedback instead of waiting for an Apple-silicon runner.
  cli:
    name: CLI (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true

      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check src/ tests/
      - name: Test
        run: uv run pytest -q
      - name: Smoke test the CLI
        run: |
          uv run nx2mac version
          uv run nx2mac version --json
          uv run nx2mac --help >/dev/null
          uv run nx2mac probe --help >/dev/null
          uv run nx2mac doctor --json | head -c 200 || true   # doctor exits 1 off macOS, by design
          echo

  # The GUI needs Xcode and an arm64 runner; this is the job that can sit in GitHub's queue.
  gui:
    name: GUI (swift build + test + release build)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Confirm the runner is arm64
        run: test "$(uname -m)" = arm64

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true

      - run: uv sync --locked
      - name: Build
        run: swift build --package-path gui
      - name: Test
        run: swift test --package-path gui

      # Also freezes the CLI into Contents/Resources/cli, exactly like a release.
      - name: Assemble the app bundle
        run: ./gui/build.sh release dist

      - name: Smoke test the bundled CLI
        run: |
          CLI=dist/nx2mac.app/Contents/Resources/cli/nx2mac
          test -x "$CLI"
          "$CLI" version
          codesign -v dist/nx2mac.app

      - name: Package the release build
        run: |
          VERSION="$(uv run python -c 'import nx2mac; print(nx2mac.VERSION)')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p out
          ditto -c -k --sequesterRsrc --keepParent \
            gui/.build/cli-dist/nx2mac "out/nx2mac-cli-$VERSION-macos-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            dist/nx2mac.app "out/nx2mac-app-$VERSION-macos-arm64.zip"
          # Same packaging as a release, so a broken DMG never reaches a tag.
          ./packaging/make_dmg.sh dist/nx2mac.app "$VERSION" out
          cd out && shasum -a 256 ./*.zip ./*.dmg > SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: nx2mac-${{ env.VERSION }}-macos-arm64-${{ github.event_name }}
          path: out/*
          if-no-files-found: error
